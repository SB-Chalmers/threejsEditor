# nginx configuration for threejsEditor (single-host deployment)
#
# Prerequisites:
#   - honeybeeDaylight backend running on port 8000
#   - Frontend built with: npm run build  (outputs to dist/)
#   - Copy or symlink dist/ to /var/www/threejsEditor or adjust root below
#
# Install:  sudo cp nginx.conf /etc/nginx/sites-available/threejseditor
#           sudo ln -s /etc/nginx/sites-available/threejseditor /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;          # replace with your domain or IP

    # ── Frontend (built Vite output) ────────────────────────────────────────
    root /var/www/threejsEditor/dist;
    index index.html;

    # SPA fallback — all unmatched routes return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Daylight + Energy backend (honeybeeDaylight on :8000) ───────────────
    # Mirrors the Vite dev server proxy: /api/daylight/* → localhost:8000/*
    location /api/daylight/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming support (study status events)
        proxy_set_header   Connection        '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
    }

    # ── EPSM is NOT proxied here ─────────────────────────────────────────────
    # EPSMService calls https://epsm.chalmers.se directly in production.
    # No nginx rule needed.

    # ── Climate EPW downloads (same as Vite dev proxy) ──────────────────────
    location /api/climate/ {
        proxy_pass       https://climate.onebuilding.org/;
        proxy_set_header Host climate.onebuilding.org;
        proxy_ssl_server_name on;
    }

    # ── Optional: serve 3dm model files with correct MIME type ──────────────
    types {
        application/octet-stream 3dm;
    }
}
